# Publishes a trained detector as a release of this repository.
#
# The training pod has no GitHub credential. It serves its out/onnx for a
# short while at an address kept in the repository variable POD_URL, so the
# address is never in the history or in a run's inputs. This workflow fetches
# the three files, checks each against the sha256 given when it was started
# (read on the pod itself), and makes the release with the workflow's own
# token. The weights were trained on generated text only (README.md).
name: publish
on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag
        required: true
      detector_sha256:
        description: sha256 of detector.onnx, read on the pod
        required: true
      tokenizer_sha256:
        description: sha256 of tokenizer.json, read on the pod
        required: true
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: fetch and check
        env:
          URL: ${{ vars.POD_URL }}
          DET: ${{ inputs.detector_sha256 }}
          TOK: ${{ inputs.tokenizer_sha256 }}
        run: |
          set -euo pipefail
          mkdir -p dist
          curl -fsSL --retry 3 -o dist/manifest.json "$URL/manifest.json"
          curl -fsSL --retry 3 -o dist/detector.onnx "$URL/detector.onnx"
          curl -fsSL --retry 3 -o dist/tokenizer.json "$URL/tokenizer.json"
          echo "$DET  dist/detector.onnx" | sha256sum -c
          echo "$TOK  dist/tokenizer.json" | sha256sum -c
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$TAG" dist/detector.onnx dist/tokenizer.json dist/manifest.json \
            --repo "$GITHUB_REPOSITORY" --title "$TAG" \
            --notes "Name detector trained on generated text only. See manifest.json."
